services:
  - type: web
    name: blue-tigers-equipment-store
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEETS_WEB_APP_URL
        sync: false
      - key: GOOGLE_SHEETS_API_TOKEN
        sync: false
